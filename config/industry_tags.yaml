# ────────────────────────────────────────────
# 软标签：商业模式特征维度
# ────────────────────────────────────────────
soft_tags:

  # ── PDF 原有维度（保留并增强） ──
  - name: "资产结构"
    options: ["重资产", "轻资产", "混合"]
    description: "固定资产占总资产的比重。重资产（>40%）、轻资产（<20%）、混合（20%-40%）"

  - name: "毛利率水平"
    options: ["高毛利", "中等毛利", "低毛利"]
    description: "行业平均毛利率水平。高（>40%）、中（15%-40%）、低（<15%）"

  - name: "客户类型"
    options: ["To-B", "To-C", "To-G"]
    description: "主要客户群体。To-B=企业客户、To-C=个人消费者、To-G=政府客户"

  - name: "竞争壁垒"
    options: ["品牌护城河", "技术壁垒", "规模效应", "特许经营", "成本优势", "网络效应", "无明显壁垒"]
    description: "核心竞争壁垒类型。网络效应为新增（适用于平台型企业）"

  - name: "现金流特征"
    options: ["奶牛型", "烧钱型", "平衡型", "周期波动型"]
    description: "经营性现金流特征。奶牛型=持续正现金流、烧钱型=长期负现金流、平衡型=大致持平"

  - name: "生命周期"
    options: ["初创期", "成长期", "成熟期", "衰退期", "转型期"]
    description: "公司/行业所处发展阶段。转型期为新增（如传统车企转型新能源）"

  # ── 新增维度（PDF 未提及，基于财务分析实践补充） ──
  - name: "研发强度"
    options: ["高研发", "中等研发", "低研发"]
    description: "研发费用占营业收入比重。高（>10%）、中（3%-10%）、低（<3%）。医药/半导体通常高研发"

  - name: "分红政策"
    options: ["高分红", "适度分红", "不分红"]
    description: "股利支付率及分红稳定性。成熟期企业通常高分红，成长期企业可能不分红"

  - name: "国际化程度"
    options: ["高度国际化", "部分国际化", "本土为主"]
    description: "海外收入占总收入比重。>30%=高度国际化"

  - name: "供应链地位"
    options: ["强势", "均衡", "弱势"]
    description: "对上下游的议价能力。可通过应付/应收周转天数差判断"

  - name: "盈利质量"
    options: ["高质量", "一般", "低质量"]
    description: "扣非净利润/净利润比值。>90%=高质量，<50%可能有非经常性损益粉饰"

  - name: "杠杆水平"
    options: ["高杠杆", "适中", "低杠杆"]
    description: "资产负债率水平。>70%=高杠杆，<30%=低杠杆"

  - name: "收入确认方式"
    options: ["一次性确认", "分期确认", "订阅制/续费制"]
    description: "收入确认模式。SAAS类通常为订阅制，工程类为分期确认"

  - name: "存货特征"
    options: ["存货跌价风险高", "正常", "无存货风险"]
    description: "存货是否易贬值。白酒=无风险（越陈越贵），电子元器件=高风险（技术迭代快）"

  - name: "商业模式"
    options: ["产品型", "平台型", "项目型", "服务型", "混合型"]
    description: "收入获取模式。产品型=卖产品、平台型=撮合交易、项目型=按项目交付、服务型=SaaS/订阅"

  - name: "受政策影响度"
    options: ["强政策驱动", "中等政策敏感", "政策不敏感"]
    description: "行业受政府政策/监管的影响程度。光伏/军工/教育=强政策驱动"

  - name: "周期性"
    options: ["强周期", "弱周期", "抗周期/防御型"]
    description: "业绩随经济周期波动的程度。煤炭/航运=强周期，医药/消费=防御型"

  - name: "商誉风险"
    options: ["高商誉风险", "中等商誉", "低商誉"]
    description: "商誉占净资产比重。>30%=高风险（可能面临减值），<10%=安全"

# ────────────────────────────────────────────
# 标签匹配权重（供 A2 层使用）
# ────────────────────────────────────────────
matching_weights:
  # 硬标签必须完全匹配，权重最高
  hard_tag_match: 1.0
  # 软标签各维度的权重（A2 计算余弦相似度时使用）
  soft_tag_weights:
    资产结构: 0.15
    毛利率水平: 0.15
    客户类型: 0.08
    竞争壁垒: 0.12
    现金流特征: 0.10
    生命周期: 0.05
    研发强度: 0.05
    分红政策: 0.02
    国际化程度: 0.03
    供应链地位: 0.05
    盈利质量: 0.05
    杠杆水平: 0.05
    商业模式: 0.05
    受政策影响度: 0.03
    周期性: 0.02
