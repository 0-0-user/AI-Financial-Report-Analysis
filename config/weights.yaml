# 
weights:

  # ───────── 营运能力（Efficiency）─────────
  存货周转率:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0
    description: "存货管理效率，越低说明积压越严重"

  存货周转天数:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0
    description: "存货平均周转时间，天数越多越差"

  应收账款周转率:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0
    description: "回款能力，越低说明回款越慢或坏账风险越大"

  应收账款周转天数:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0
    description: "平均回款天数"

  总资产周转率:
    category: "营运能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "总资产使用效率，越高越好"

  固定资产周转率:
    category: "营运能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "固定资产利用效率"

  # ───────── 盈利能力（Profitability）─────────
  毛利率:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "产品定价能力和成本控制能力的综合体现"

  净利率:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "最终盈利能力"

  营业利润率:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "主营业务盈利水平"

  ROE:
    category: "盈利能力"
    base_weight: 2
    direction: "positive"
    amplification_cap: 2.5
    description: "净资产收益率（股东回报），核心盈利指标"

  ROA:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "总资产收益率"

  扣非净利润占比:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "扣非净利润/净利润，反映盈利质量"

  # ───────── 偿债能力（Solvency）─────────
  资产负债率:
    category: "偿债能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 2.5
    description: "财务杠杆水平，过高=风险大"

  流动比率:
    category: "偿债能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "短期偿债能力"

  速动比率:
    category: "偿债能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0
    description: "剔除存货后的短期偿债能力"

  利息保障倍数:
    category: "偿债能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 3.0
    description: "EBIT/利息费用，衡量偿付利息能力"

  有息负债率:
    category: "偿债能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 2.5
    description: "有息负债/总资产，比总负债率更精确"

  # ───────── 成长能力（Growth）─────────
  营业收入增长率:
    category: "成长能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 3.0
    description: "营收同比增长"

  净利润增长率:
    category: "成长能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 3.0
    description: "利润同比增长"

  总资产增长率:
    category: "成长能力"
    base_weight: 0.5
    direction: "positive"
    amplification_cap: 2.0
    description: "资产扩张速度"

  研发费用率:
    category: "成长能力"
    base_weight: 0.5
    direction: "neutral"
    amplification_cap: 1.5
    description: "研发投入/营收（偏高≠利空，需结合行业判断）"

  # ───────── 现金流质量（Cash Flow Quality）─────────
  经营现金流营收比:
    category: "现金流质量"
    base_weight: 2
    direction: "positive"
    amplification_cap: 3.0
    description: "经营现金流/营业收入，反映收入含金量"

  自由现金流率:
    category: "现金流质量"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.5
    description: "自由现金流/净利润"

  # ───────── 资产质量（Asset Quality）─────────
  商誉占比:
    category: "资产质量"
    base_weight: -2
    direction: "negative"
    amplification_cap: 3.0
    description: "商誉/净资产，过高=减值风险大"

  存货跌价准备率:
    category: "资产质量"
    base_weight: -1
    direction: "negative"
    amplification_cap: 2.5
    description: "存货跌价准备/存货账面价值"

  应收账款坏账率:
    category: "资产质量"
    base_weight: -1
    direction: "negative"
    amplification_cap: 2.5
    description: "坏账准备/应收账款"

  # ───────── 分红回报（Dividend）─────────
  股息率:
    category: "分红回报"
    base_weight: 0.5
    direction: "positive"
    amplification_cap: 1.5
    description: "每股分红/股价"

  股利支付率:
    category: "分红回报"
    base_weight: 0.5
    direction: "neutral"
    amplification_cap: 1.0
    description: "分红/净利润，过高可能影响再投资"

# ────────────────────────────────────────────
# 特殊情况权重覆盖
# ────────────────────────────────────────────
# 某些行业某些指标的行为与其他行业相反，需要特殊处理

overrides:
  # 银行/金融行业：资产负债率不是越高越差
  - industries: ["银行", "证券", "保险", "城商行"]
    indicator: "资产负债率"
    base_weight: 0      # 银行天然高杠杆，不扣分
    direction: "neutral"

  # 重资产行业：总资产周转率低是正常的
  - industries: ["煤炭开采", "石油开采", "电力", "钢铁", "航空", "铁路运输"]
    indicator: "总资产周转率"
    base_weight: 0.3    # 降低权重
    direction: "positive"

  # 高研发行业：研发费用率偏高算中性
  - industries: ["半导体设计", "半导体制造", "化学制药", "生物制品", "云计算", "网络安全"]
    indicator: "研发费用率"
    base_weight: 0.2    # 研发高不是坏事
    direction: "neutral"
