# ==========================================================
# config/industry_thresholds.yaml — 行业级 B+ 层阈值
# ==========================================================
#
# 为每个同花顺三级行业提供专属的统计基准。
#
# 数据来源：akshare 全 A 股近 5 年财务数据统计
# 更新频率：季度更新（随财报季刷新）
#
# 字段说明（吴林港2022 + 企业规模分层框架）：
#   净现比/收现比 判定: 实际值 < 行业 p75 且 < 0.6（双条件）→ 标记
#   net_profit_cash_ratio_p75: 净现比 75% 分位数
#   net_profit_cash_ratio_p25: 净现比 25% 分位数（极严重阈值）
#   sales_cash_ratio_p75: 收现比 75% 分位数
#   sales_cash_ratio_p25: 收现比 25% 分位数（极严重阈值）
#   存贷双高 判定: 两者同时 > 同规模 p75 → 标记
#   cash_to_assets_p75: 货币资金/总资产 75% 分位数
#   debt_to_assets_p75: 有息负债/总资产 75% 分位数
#   母子资金分离 判定: |差值| > 均值 + 2σ → 标记
#   fund_separ_mean: 行业母子资金分离度均值
#   fund_separ_std: 行业母子资金分离度标准差
#
# 由谁维护：分析师/数据工程
# 被谁使用：B+ 层（layers/layer_bplus_internal/logic_checks.py）

