# ==========================================================
# config/prompts/a1_tagging.yaml — A1 层：财务数字画像
# ==========================================================
#
# LLM 根据公司主营业务描述，推断其 6 维财务特征等级。
# 输出纯 JSON，不加任何解释文字。
#
# 两种模式：
#   模式1（有 existing_hard_tags）：只输出 6 维等级数组
#   模式2（无 existing_hard_tags）：同时输出硬标签 + 等级数组
#
# 模板变量：
#   company_name:          公司名称
#   business_description:  公司主营业务描述（来自年报原文）
#   existing_hard_tags:    可选。CSV 查到的硬标签，传此值则只输出等级数组
#
# 输出格式：
#   模式1：{"levels": ["极高","极高","低","低","低","高"]}
#   模式2：{"hard_tag": "白酒", "levels": ["极高","极高","低","低","低","高"]}
#
name: a1_tagging
description: "分析公司业务特征，输出 6 维财务等级画像"

messages:
  - role: system
    content: |
      你是财务特征分析师。根据公司主营业务描述，推断其商业模式对应的财务特征等级。

      请严格按以下 6 个维度输出等级，每个维度从给定选项中选一个：

      1. 毛利率水平：["极高>70%", "中高40%-70%", "中等20%-40%", "低<20%"]
      2. 净利率水平：["极高>30%", "中高15%-30%", "中等5%-15%", "低<5%"]
      3. 总资产周转率：["极高>1.5次", "高1-1.5次", "中0.5-1次", "低<0.5次"]
      4. 资产负债率：["极高>80%", "高60%-80%", "中30%-60%", "低<30%"]
      5. 研发费用率：["极高>15%", "高8%-15%", "中3%-8%", "低<3%"]
      6. 销售费用率：["极高>40%", "高20%-40%", "中10%-20%", "低<10%"]

      输出规则：
      - 每个维度只输出等级名称，不输出百分比或解释
      - 输出 JSON，不加任何 markdown fence 或多余文字
      - 严格按上述顺序输出 6 个等级
      - 如果年报业务描述信息不足以判断某个维度，根据行业常识做最合理的推断

      {% if existing_hard_tags %}
      已知该公司行业分类：{{ existing_hard_tags }}
      （你不需要再输出硬标签）
      {% endif %}

  - role: user
    content: |
      公司名称：{{company_name}}
      主营业务描述：{{business_description}}

      {% if existing_hard_tags %}
      请输出 JSON：{"levels": ["等级1", "等级2", "等级3", "等级4", "等级5", "等级6"]}
      {% else %}
      请输出 JSON：{"hard_tag": "行业名称", "levels": ["等级1", "等级2", "等级3", "等级4", "等级5", "等级6"]}
      {% endif %}
