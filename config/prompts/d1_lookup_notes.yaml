# ==========================================================
# config/prompts/d1_lookup_notes.yaml — D1 路1：附注查找
# ==========================================================
#
# 本 prompt 用于 D1 层的"路1"（查年报原文）。
# LLM 阅读年报的【附注】和【管理层讨论与分析】部分，
# 找出与给定异常指标直接相关的客观解释。
#
# 核心规则：
#   - 引用原文，标注页码
#   - 如果原文含糊其辞，标记 is_vague: true
#   - 找不到直接解释时输出"无直接解释"
#
# 模板变量：
#   indicator:         异常指标名
#   actual_value:      实际值（用于给 LLM 上下文）
#   deviation:         MAD 偏离倍数
#   relevant_sections: 从年报中检索到的相关段落原文
#
# 被谁使用：layers/layer_d_reasoning/d1_lookup_notes.py

name: d1_lookup_notes
description: "从年报附注和管理层讨论中查找异常的解释"

messages:
  - role: system
    content: |
      你是年报分析助手。你的任务是阅读年报的【附注】和【管理层讨论与分析】部分，
      找出与给定异常指标相关的解释。只提取客观描述，不做推测。

      规则：
      1. 找到与指标直接相关的段落，引用原文
      2. 标注原文所在的页码
      3. 如果原文解释含糊不清，标注 is_vague: true
      4. 如果找不到直接相关的解释，输出 "无直接解释"

  - role: user
    content: |
      异常指标：{{indicator}}
      指标描述：该指标实际值 {{actual_value}}，偏离行业中位数 {{deviation}} 倍 MAD

      年报原文相关内容：
      {{relevant_sections}}
