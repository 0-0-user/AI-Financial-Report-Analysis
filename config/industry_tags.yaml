# ==========================================================
# config/industry_tags.yaml — A1 层：行业标签体系定义
# ==========================================================
#
# 本文件定义了 A1 层打标签时使用的标签体系。
# LLM 读取公司基本情况后，按这里的维度给公司打定性标签。
#
# 标签分两类：
# 1. 硬标签（hard_tags）：客观行业分类
#    用于 A2 层第一步——强制锁定同行范围
#    目前定义了一个分类体系名称，具体行业名称由 LLM 根据实际情况输出
#    （如同花顺三级行业的"白酒"、"房地产开发"等）
#
# 2. 软标签（soft_tags）：主观商业模式特征
#    用于 A2 层第二步——在同行业中找最相似的企业
#    每个维度都是固定的选项列表，LLM 从中选择
#    维度越多，匹配精度越高
#
# 由谁维护：分析师（可增加软标签维度或选项）
# 被谁使用：A1 层（layers/layer_a_benchmark/a1_tagging.py）

hard_tags:
  - name: "同花顺三级行业"
    description: "同花顺行业分类标准，精确到三级"
    source: "同花顺 iFinD"

soft_tags:
  - name: "资产结构"
    options: ["重资产", "轻资产", "混合"]
    description: "固定资产占总资产比重"

  - name: "毛利率水平"
    options: ["高毛利", "中等毛利", "低毛利"]
    description: "行业平均毛利率水平"

  - name: "客户类型"
    options: ["To-B", "To-C", "To-G"]
    description: "主要客户群体"

  - name: "竞争壁垒"
    options: ["品牌护城河", "技术壁垒", "规模效应", "特许经营", "无明显壁垒"]
    description: "核心竞争壁垒类型"

  - name: "现金流特征"
    options: ["奶牛型", "烧钱型", "平衡型"]
    description: "经营性现金流特征"

  - name: "生命周期"
    options: ["初创期", "成长期", "成熟期", "衰退期"]
    description: "行业发展阶段"
