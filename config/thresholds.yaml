# ==========================================================
# config/thresholds.yaml — D2 层：D-S 证据理论参数
# ==========================================================
#
# 本文件专用于 D2 层 D-S 证据理论的 mass 分配参数。
#
# D-S 参数说明：
#   epsilon_1: 路1 uncertainty（年报未提及时 mass 全归 Θ）
#   epsilon_2: 路2 uncertainty（外部推演不确定时 mass 全归 Θ）
#   path1_split_primary: 路1 k=2 时的主要归因占比（剩余给次要）
#   path1_split_secondary: 路1 k=2 时的次要归因占比
#   path2_top_n: 路2 保留的假设数量上限（按 consensus_weight 排序取前 N）
#   conflict_threshold: Dempster 合成 K 值超过此阈值时标注 severe_conflict
#
# 由谁维护：项目负责人
# 被谁使用：D2 层（layers/layer_d_reasoning/d2_probability.py）
#          注：B+ / C 层阈值已迁至 config/industry_thresholds.yaml

d2_layer:
  # 路1 uncertainty（年报未提及的剩余质量）
  epsilon_1: 0.35
  # 路2 uncertainty（外部推演不确定的剩余质量）
  epsilon_2: 0.30
  # 路1 k=2 时的主要/次要比例
  path1_split_primary: 0.70
  path1_split_secondary: 0.30
  # 路2 保留的假设数量上限
  path2_top_n: 5
  # 严重冲突 K 值阈值（超过此值标注 severe_conflict）
  conflict_threshold: 0.60
