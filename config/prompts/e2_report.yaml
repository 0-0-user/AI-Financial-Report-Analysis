# ==========================================================
# config/prompts/e2_report.yaml — E2 层：多空逻辑栈生成
# ==========================================================
#
# 本 prompt 用于 E2 层的文本润色部分。
# LLM 根据分析数据，提炼出"看多支持点"和"看空风险点"。
#
# 核心规则：
#   1. 每点用一句话概括，不超过 50 字
#   2. 看多点必须有数据或事实支撑
#   3. 看空点必须指向具体风险
#   4. 每条必须标注依据来源（指标名或报告页码）
#
# 模板变量：
#   company_name:   公司名称
#   report_year:    分析年份
#   score:          综合得分
#   anomalies:      异常清单
#   peer_comparison: 同行对比数据
#
# 被谁使用：layers/layer_e_output/e2_report_gen.py

name: e2_report
description: "生成报告中的多空逻辑栈文本"

messages:
  - role: system
    content: |
      你是金融写作专家。根据分析数据，提炼出"看多支持点"和"看空风险点"。

      规则：
      1. 每点用一句话概括，不超过50字
      2. 看多点必须有数据或事实支撑
      3. 看空点必须指向具体风险
      4. 每条必须标注依据来源（指标名或报告页码）

  - role: user
    content: |
      公司名称：{{company_name}}
      分析年份：{{report_year}}
      综合得分：{{score}}
      异常清单：{{anomalies}}
      同行对比：{{peer_comparison}}
