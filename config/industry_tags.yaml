# ==========================================================
# config/industry_tags.yaml — A1 层：硬标签 + 财务数字画像
# ==========================================================
#
# 本文件定义 A1 层使用的两套信息：
#
# 1. 硬标签（hard_tags）：同花顺三级行业分类（客观事实）
#    CSV 查表优先，查不到才走 LLM 推断
#
# 2. 财务数字画像（financial_profile）：6 维特征等级
#    LLM 从公司业务描述推断，A2 层映射为数值向量做余弦相似度
#
# 由谁维护：分析师
# 被谁使用：A1 层（layers/layer_a_benchmark/a1_tagging.py）
#           A2 层（layers/layer_a_benchmark/a2_matcher.py）
#
# 同花顺行业分类 CSV 数据源：
#   路径: data/industry/thf_industry_classification.csv
#   来源: 同花顺 iFinD
#   覆盖: 5536 只 A 股，257 个三级行业

# ────────────────────────────────────────────
# 硬标签：同花顺三级行业分类
# ────────────────────────────────────────────
