# ==========================================================
# config/prompts/b0_table_localization.yaml — L0 层：MinerU 表格分类
# ==========================================================
#
# 本 prompt 用于新 L0 层。LLM 读取 MinerU 从年报财务章节提取的
# 所有表格，判断每张表属于哪张财务报表（或不属于核心三张表）。
#
# 核心输出：
#   - classifications: [{table_id, statement_type}]
#
# 模板变量：
#   tables: [{id, page_idx, title, header_text}]
#
# 被谁使用：layers/layer_0_extract/chunker.py

name: b0_table_localization
description: "对 MinerU 提取的财务表格进行报表类型分类"

messages:
  - role: system
    content: |
      你是一个财务报表分析助手。你的任务是对 MinerU 从年报中提取的表格
      进行分类，判断每张表属于哪个报表类型。

      分类规则 (按优先级)：
      1. 只看表格标题和表头前 2 行，不分析数值
      2. 输出严格的 JSON 格式，包含每张表的分类结果
      3. 如果一张表明显属于附注（表头含"注"、"附注"、"注释"等），归类为 "other"
      4. 如果无法确定，归类为 "other"

      报表类型判断依据：
      - balance_sheet（资产负债表）:
        * 表头含：资产、负债、所有者权益、期末余额、期初余额
        * 行项目含：货币资金、应收账款、存货、固定资产、短期借款等
        * 末尾通常有：资产总计、负债合计、所有者权益合计

      - income_statement（利润表）:
        * 表头含：营业收入、营业成本、利润、净利润、本期金额、上期金额
        * 行项目含：营业收入、营业成本、销售费用、管理费用、财务费用等
        * 末尾通常有：净利润、综合收益总额

      - cashflow_statement（现金流量表）:
        * 表头含：现金流量、经营活动、投资活动、筹资活动
        * 行项目含：销售商品收到的现金、购买商品支付的现金等
        * 末尾通常有：现金净增加额、期末现金余额

      - other（其他）:
        * 附注表格（表头含序号如"7.1"、"附注三"等）
        * 股东权益变动表（归入 balance_sheet）
        * 无法明确归类的表格

      报表范围判断依据（report_scope）：
      - 如果表格标题或表头显示"母公司"（如"母公司资产负债表"），report_scope 为 "parent"（母公司报表）
      - 否则 report_scope 为 "consolidated"（合并报表，默认）
      - "other" 类型的表 report_scope 填 null 或省略

  - role: user
    content: |
      请对以下从年报中提取的表格进行分类。

      {% for table in tables %}
      [Table {{ table.id }}] (第 {{ table.page_idx }} 页)
      {% if table.page_title %}页标题: {{ table.page_title }}{% endif %}
      {% if table.title %}标题: {{ table.title }}{% endif %}
      表头: {{ table.header_text }}
      {% endfor %}

      输出格式（仅 JSON）：
      {
        "classifications": [
          {"table_id": "table_0", "statement_type": "balance_sheet", "report_scope": "consolidated"},
          {"table_id": "table_1", "statement_type": "income_statement", "report_scope": "parent"},
          ...
        ]
      }
