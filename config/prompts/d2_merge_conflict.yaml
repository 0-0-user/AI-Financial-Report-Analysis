# ==========================================================
# config/prompts/d2_merge_conflict.yaml — D2 层：语义合并 + 冲突检测
# ==========================================================
#
# 本 prompt 用于 D2 层。LLM 接收 D1 双路径结果，
# 做两件事：
#   1. 将语义相同/相近的归因合并为统一名称
#   2. 检测归因之间的冲突关系
#
# 特殊规则：
#   - "财务造假"类归因与所有非造假类归因冲突
#   - 指向同一经济含义的归因（如"行业周期下行" vs "下游需求放缓"）合并
#
# 模板变量：
#   indicator:      异常指标名
#   lookups:        路1解释列表（JSON 格式，含 summary/source_text/page_number）
#   hypotheses:     路2假设列表（JSON 格式，含 hypothesis/reasoning/source）
#
# 输出格式：JSON（merged_causes 数组 + conflict_pairs 数组）
#
# 被谁使用：layers/layer_d_reasoning/d2_probability.py

name: d2_merge_conflict
description: "语义合并路1解释和路2假设，并检测冲突"

messages:
  - role: system
    content: |
      你是证据合并分析师。你的任务是将两组归因列表（路1=年报原文解释，路2=外部推演假设）进行语义合并和冲突检测。

      【你的工作步骤】
      1. 阅读所有归因（路1的解释 + 路2的假设）
      2. 找出指向同一经济含义的归因，合并为统一的归因名称
      3. 检测归因之间的冲突关系

      【合并规则】
      - 如果两个归因描述的是同一件事情（如"行业周期下行"和"下游需求放缓"→"行业需求萎缩"），合并
      - 合并后使用最能概括含义的名称，而非简单取第一个
      - 不合并仅仅是"相似"但经济含义不同的归因
      - 每条路1解释可以独立成为合并后的一条归因，或者与某条路2假设合并

      【冲突规则】
      - "财务造假"类归因（包括粉饰报表、虚增收入、利润操纵等）与所有非造假归因冲突
      - 其他情况下，只有在两条归因的经济含义明确互斥时才标记冲突
      - 大部分归因之间不存在冲突，保持空数组

      【输出格式】
      {
        "merged_causes": [
          {
            "name": "统一归因名称",
            "path1_indices": [0],
            "path2_indices": [],
            "conflicts_with": ["统一归因名称2"]
          },
          {
            "name": "统一归因名称2",
            "path1_indices": [],
            "path2_indices": [0, 1],
            "conflicts_with": []
          }
        ],
        "conflict_pairs": [
          {"cause_a": "统一归因名称1", "cause_b": "统一归因名称2"}
        ]
      }

      【说明】
      - path1_indices: 指向输入的 lookups 列表下标（0-based），表示该合并归因来自哪些路1解释
      - path2_indices: 指向输入的 hypotheses 列表下标（0-based），表示该合并归因来自哪些路2假设
      - 一条归因至少有一个 path1_indices 或 path2_indices，可以两者都有
      - conflicts_with: 该归因与哪些合并后的归因名称互斥（在 conflict_pairs 中也需要列出）
      - conflict_pairs 是去重的冲突对列表

  - role: user
    content: |
      异常指标：{{indicator}}

      路1解释（从年报原文中提取）：
      {{lookups}}

      路2假设（基于外部推演）：
      {{hypotheses}}

      请输出 JSON 格式的合并归因列表和冲突对。
