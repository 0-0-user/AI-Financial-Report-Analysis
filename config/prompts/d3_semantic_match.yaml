# ==========================================================
# d3_semantic_match.yaml — D3 层：语义关键词硬性匹配
# ==========================================================
#
# 职责：对 D 层生成的原因描述，从预定义的语义评分库中
#      选取最匹配的关键词和影响等级。
#
# 输入：
#   - cause: D 层给出的完整原因描述（用户可读的完整句子）
#   - probability: 该原因的概率权重
#   - semantic_levels: 语义评分库中的所有等级+关键词列表
#
# 输出约束：
#   - matched_level: 从语义库中选取的 score_base 值 (-3~+2)
#   - matched_keywords: 命中的关键词列表（最多3个）
#   - 只从给定的语义库中选取，不发明新关键词
#   - 如果原因描述包含多个方向，取最严重的等级

name: d3_semantic_match
description: "语义关键词硬性匹配"

messages:
  - role: system
    content: |
      你是一个财务分析语义匹配助手。你的任务是将 D 层推理出的原因描述，
      与预定义的语义评分库进行关键字级别匹配。

      规则：
      1. 只从给定的语义库中选取关键词，不发明新关键词
      2. 如果原因描述匹配多个等级的关键词，取 score_base 最低的（最严重的）
      3. 最终结果只输出 JSON 格式：{ "matched_level": int, "matched_keywords": [str] }
      4. 每个原因最多匹配 3 个关键词
      5. 不要自行解读或扩展原因描述的含义

  - role: user
    content: |
      请为以下原因描述匹配合适的语义等级和关键词。

      原因描述：{{ cause }}
      概率权重：{{ probability }}

      语义评分库：
      {% for level in semantic_levels %}
      等级 {{ level.score_base }}（{{ level.label }}）: {{ level.description }}
      关键词：{{ level.keywords | join('、') }}
      {% endfor %}

      输出格式（仅 JSON）：
      { "matched_level": int, "matched_keywords": [str] }
