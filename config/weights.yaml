# ==========================================================
# config/weights.yaml — E1 层：指标基础影响权重库
# ==========================================================
#
# 本文件定义了 E1 层打分公式中每个财务指标的基础权重和方向。
# 权重为正数表示该指标偏离是利好（如毛利率越高越好），
# 权重为负数表示该指标偏离是利空（如存货周转率越低越差）。
#
# 由谁维护：分析师（修改权重不需要改代码）
# 被谁使用：E1 层（layers/layer_e_output/e1_scoring.py）
#
# 字段说明：
#   category:       指标分类（营运能力/盈利能力/偿债能力/成长能力）
#   base_weight:    基础影响权重（正数=利好, 负数=利空）
#   direction:      positive=偏离大是好事, negative=偏离大是坏事
#   amplification_cap: MAD 放大倍数上限，防止极端偏离导致过度扣分
#
# 打分公式参考：
#   实际影响权重 = base_weight × (1 + MAD 偏离度 / 3)
#   期望影响 = 概率 × 实际影响权重
#   C 层扣分 = 期望影响 × MAD 偏离度

weights:
  存货周转率:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0

  应收账款周转率:
    category: "营运能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 3.0

  毛利率:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0

  净利率:
    category: "盈利能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0

  资产负债率:
    category: "偿债能力"
    base_weight: -1
    direction: "negative"
    amplification_cap: 2.5

  流动比率:
    category: "偿债能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 2.0

  营业收入增长率:
    category: "成长能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 3.0

  净利润增长率:
    category: "成长能力"
    base_weight: 1
    direction: "positive"
    amplification_cap: 3.0
