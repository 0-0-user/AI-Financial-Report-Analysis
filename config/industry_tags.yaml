# ────────────────────────────────────────────
# 财务数字画像：6 维特征等级（A2 层匹配核心）
# ────────────────────────────────────────────
#
# A1 层 LLM 输出 6 维等级数组，A2 层映射为数值向量做余弦相似度。
# 同行数据通过 akshare 在线获取 + 内存缓存。
#
financial_profile:

  # 6 维度定义（顺序固定，全局一致）
  dimensions:
    - name: "毛利率水平"
      description: "毛利率 = (营收 - 营业成本) / 营收"
      thresholds:
        极高: 0.70
        中高: 0.40
        中等: 0.20
        低: 0.0

    - name: "净利率水平"
      description: "净利率 = 净利润 / 营收"
      thresholds:
        极高: 0.30
        中高: 0.15
        中等: 0.05
        低: 0.0

    - name: "总资产周转率"
      description: "周转率 = 营收 / 总资产（次）"
      thresholds:
        极高: 1.5
        高: 1.0
        中: 0.5
        低: 0.0

    - name: "资产负债率"
      description: "负债率 = 总负债 / 总资产"
      thresholds:
        极高: 0.80
        高: 0.60
        中: 0.30
        低: 0.0

    - name: "研发费用率"
      description: "研发率 = 研发费用 / 营收"
      thresholds:
        极高: 0.15
        高: 0.08
        中: 0.03
        低: 0.0

    - name: "销售费用率"
      description: "销售率 = 销售费用 / 营收"
      thresholds:
        极高: 0.40
        高: 0.20
        中: 0.10
        低: 0.0

  # 等级→数值映射（A2 向量匹配用）
  level_scores:
    极高: 1.0
    高: 0.8
    中高: 0.8
    中等: 0.5
    中: 0.5
    低: 0.2
