# ==========================================================
# config/semantic_scoring.yaml — 语义三档定性库
# ==========================================================
#
# 用途：将 D 层输出的原因描述通过 LLM 关键词匹配，映射为影响分 S_base
# 由谁使用：D3 语义匹配步骤（layers/layer_d_reasoning/d3_semantic_matcher.py）
#           E1 评分层（layers/layer_e_output/e1_scoring.py）
#
# 匹配规则：
#   - LLM 将 D 层给出的完整原因描述与下方关键词做硬性匹配
#   - 匹配采取"取最严重"原则：同时匹配多个级别时取 score_base 最低的
#   - 不发明新关键词，只从下方列表中选取
# ==========================================================

version: 1
description: "语义三档定性库 - 用于将D层原因描述映射为影响分"

levels:
  # ── 严重负向 (-3)：明确的财务造假、虚构、隐瞒、利益输送 ──
  - score_base: -3
    label: "严重负向"
    description: "明确的财务造假、虚构交易、隐瞒负债、利益输送"
    keywords:
      - "造假"
      - "粉饰"
      - "虚增"
      - "虚构"
      - "隐瞒"
      - "伪造"
      - "盈余操纵"
      - "利益输送"
      - "资金占用"
      - "违规担保"
      - "财务造假"
      - "虚构收入"
      - "虚增利润"
      - "虚增资产"
      - "隐瞒负债"
      - "关联交易非关联化"

  # ── 中度负向 (-2)：会计处理不恰当、不合规、激进 ──
  - score_base: -2
    label: "中度负向"
    description: "会计处理不恰当、不合规、资本化过度、减值不充分"
    keywords:
      - "激进"
      - "提前确认"
      - "不恰当"
      - "不合规"
      - "跨期调节"
      - "资本化过度"
      - "减值不充分"
      - "虚高"
      - "操纵"
      - "会计处理"
      - "不当"
      - "费用资本化"
      - "坏账准备不足"
      - "折旧摊销"
      - "不充分"
      - "递延所得税"
      - "关联交易定价"
      - "非公允"

  # ── 轻微负向 (-1)：指标偏高/偏低/波动、存在风险 ──
  - score_base: -1
    label: "轻微负向"
    description: "指标偏高/偏低/波动、存在风险、需关注、趋势恶化"
    keywords:
      - "偏高"
      - "偏低"
      - "波动"
      - "异常"
      - "风险"
      - "下滑"
      - "背离"
      - "恶化"
      - "关注"
      - "过高"
      - "过低"
      - "不足"
      - "下降"
      - "低于"
      - "超过"
      - "缺口"
      - "压力"
      - "放缓"
      - "弱于"
      - "偏离"
      - "趋势"

  # ── 中性 (0)：行业性质、季节因素、正常波动、无风险 ──
  - score_base: 0
    label: "中性"
    description: "行业性质、季节因素、正常波动、无风险、解释合理"
    keywords:
      - "行业性质"
      - "行业正常"
      - "行业普遍"
      - "季节因素"
      - "正常波动"
      - "无风险"
      - "不影响"
      - "解释合理"
      - "结构变化"
      - "正常范围"
      - "行业特征"
      - "普遍现象"
      - "可接受"
      - "可控"
      - "在范围内"

  # ── 正向 (+1)：指标稳健、充足、良好、改善 ──
  - score_base: 1
    label: "正向"
    description: "指标稳健、充足、良好、改善、覆盖充分"
    keywords:
      - "稳健"
      - "充足"
      - "良好"
      - "改善"
      - "合理"
      - "正常范围"
      - "覆盖充分"
      - "稳定"
      - "充裕"
      - "充沛"
      - "优于"
      - "提升"
      - "增强"
      - "保持"
      - "健康"
      - "乐观"

  # ── 显著正向 (+2)：远超预期、行业领先、极其稳健 ──
  - score_base: 2
    label: "显著正向"
    description: "远超预期、行业领先、极其稳健、极低风险"
    keywords:
      - "远超预期"
      - "行业领先"
      - "极其稳健"
      - "显著优于"
      - "大幅改善"
      - "极低风险"
      - "领先"
      - "标杆"
      - "卓越"
      - "非常充足"
      - "非常稳健"
